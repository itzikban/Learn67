<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מעקב שימוש כיתתי — learn67</title>
<style>
  *{box-sizing:border-box}
  body{font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f4f6fb;color:#1f2a44;margin:0;padding:20px;max-width:760px;margin-inline:auto}
  h1{font-size:22px;margin:0 0 4px}
  .muted{color:#8a94a8;font-size:14px}
  .card{background:#fff;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 8px rgba(30,50,90,.07)}
  input{width:100%;font:inherit;padding:10px 12px;border:2px solid #e2e8f5;border-radius:12px;margin:8px 0}
  button{font:inherit;font-weight:800;border:none;border-radius:12px;padding:10px 18px;background:#3b82f6;color:#fff;cursor:pointer}
  button:active{transform:translateY(2px)}
  table{width:100%;font-size:14px;border-collapse:collapse}
  th{color:#8a94a8;font-weight:700;text-align:right;padding:8px 6px;border-bottom:2px solid #eef1f7}
  td{padding:8px 6px;border-top:1px solid #eef1f7;text-align:right}
  .err{color:#b02020;font-weight:700}
  a.back{color:#8a94a8;font-size:13px;text-decoration:none}
</style>
</head>
<body>
  <h1>📊 מעקב שימוש כיתתי</h1>
  <p class="muted">לאור בלבד — הכניסה לכאן היא רק דרך כתובת /audit.</p>

  <div class="card" id="loginCard">
    <b>מפתח ניהול</b>
    <input type="password" id="keyInput" placeholder="הכניסו מפתח" autocomplete="off">
    <button id="loginBtn">כניסה</button>
    <p class="err" id="loginErr" style="display:none">מפתח שגוי.</p>
  </div>

  <div class="card" id="dataCard" style="display:none">
    <p style="margin:0 0 8px"><b id="devCount">0</b> מכשירים נרשמו</p>
    <div style="overflow-x:auto">
    <table>
      <thead><tr><th>ילד/ה</th><th>נרשם</th><th>פעילות אחרונה</th><th>כניסות</th><th>מדמים</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    </div>
    <p class="muted" id="emptyMsg" style="display:none">אין עדיין נתונים.</p>
    <p style="margin-top:12px"><button id="refreshBtn" style="background:#eef1f7;color:#1f2a44">רענון</button></p>
  </div>

  <p><a class="back" href="/">→ חזרה לאפליקציה</a></p>

<script>
(function(){
  "use strict";
  var key = "";
  try{ key = sessionStorage.getItem("learn67-audit-key") || ""; }catch(e){}
  var loginCard = document.getElementById("loginCard");
  var dataCard = document.getElementById("dataCard");

  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  async function load(){
    var r;
    try{
      r = await fetch("/api/audit?key="+encodeURIComponent(key));
    }catch(e){
      showLogin("שגיאת חיבור. ודאו שיש אינטרנט.");
      return;
    }
    if(r.status===403){ showLogin("מפתח שגוי."); return; }
    if(!r.ok){ showLogin("שגיאה בטעינה ("+r.status+")."); return; }
    var j = await r.json();
    try{ sessionStorage.setItem("learn67-audit-key", key); }catch(e){}
    loginCard.style.display = "none";
    dataCard.style.display = "block";
    var devs = j.devices || [];
    document.getElementById("devCount").textContent = devs.length;
    document.getElementById("emptyMsg").style.display = devs.length ? "none" : "block";
    var html = "";
    devs.forEach(function(d){
      var f = String(d.firstSeen||"").slice(0,10);
      var l = String(d.lastSeen||"").slice(0,10);
      html += "<tr><td><b>"+esc(d.child||"—")+"</b></td>"+
        "<td><bdi>"+esc(f)+"</bdi></td><td><bdi>"+esc(l)+"</bdi></td>"+
        "<td>"+esc(d.visits||0)+"</td><td>"+esc(d.mocks||0)+"</td></tr>";
    });
    document.getElementById("rows").innerHTML = html;
  }

  function showLogin(msg){
    try{ sessionStorage.removeItem("learn67-audit-key"); }catch(e){}
    key = "";
    dataCard.style.display = "none";
    loginCard.style.display = "block";
    var e = document.getElementById("loginErr");
    if(msg){ e.textContent = msg; e.style.display = "block"; }
    else { e.style.display = "none"; }
  }

  document.getElementById("loginBtn").addEventListener("click", function(){
    key = document.getElementById("keyInput").value.trim();
    if(!key) return;
    load();
  });
  document.getElementById("keyInput").addEventListener("keydown", function(e){
    if(e.key==="Enter") document.getElementById("loginBtn").click();
  });
  document.getElementById("refreshBtn").addEventListener("click", load);

  if(key) load();
})();
</script>
</body>
</html>
